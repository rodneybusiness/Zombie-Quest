name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.9.0-beta)'
        required: true
        default: 'v0.9.0-beta'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Verify build
      run: |
        pytest tests/ -q
        python main.py --headless
        python tools/validate_assets.py
    - name: Resolve tag name
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
        else
          echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
        fi
    - name: Package
      run: |
        mkdir -p dist
        git archive --format=zip --prefix=zombie-quest/ \
          -o "dist/zombie-quest-${{ steps.tag.outputs.name }}.zip" HEAD
    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.name }}
        target_commitish: ${{ github.sha }}
        prerelease: true
        generate_release_notes: true
        files: dist/*.zip
        body: |
          **Zombie Quest: Neon Dead — Minneapolis '82** beta.

          Sierra-style point-and-click adventure: ten hand-authored 320×200
          scenes on a locked 32-color palette, 16×32 sprite walk cycles,
          five endings, ~15-minute demo arc.

          **To play**: unzip, then `./run_game.sh` (macOS/Linux) or
          `run_game.bat` (Windows). Requires Python 3.9+; pygame installs
          automatically. Testers: see `PLAYTEST.md`.
