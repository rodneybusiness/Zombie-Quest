name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Verify build
      run: |
        pytest tests/ -q
        python main.py --headless
        python tools/validate_assets.py
    - name: Package
      run: |
        mkdir -p dist
        git archive --format=zip --prefix=zombie-quest/ \
          -o "dist/zombie-quest-${GITHUB_REF_NAME}.zip" HEAD
    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        generate_release_notes: true
        files: dist/*.zip
        body: |
          **Zombie Quest: Neon Dead — Minneapolis '82** beta.

          Sierra-style point-and-click adventure: ten hand-authored 320×200
          scenes on a locked 32-color palette, 16×32 sprite walk cycles,
          five endings, ~15-minute demo arc.

          **To play**: unzip, then `./run_game.sh` (macOS/Linux) or
          `run_game.bat` (Windows). Requires Python 3.9+; pygame installs
          automatically. Testers: see `PLAYTEST.md`.
